<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Doctor - Plant Disease Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>{{ ui.crop_doctor_title }}</h1>
        <p>{{ ui.crop_doctor_subtitle }}</p>
    </header>
    <main>
        <form method="post" enctype="multipart/form-data">
            <label for="plant_image">{{ ui.select_plant_image }}</label>
            <input type="file" id="plant_image" name="plant_image" accept="image/*" required>
            <label for="language">{{ ui.choose_language }}</label>
            <select id="language" name="language">
                <option value="en" {% if selected_language == 'en' %}selected{% endif %}>English</option>
                <option value="hi" {% if selected_language == 'hi' %}selected{% endif %}>Hindi</option>
                <option value="te" {% if selected_language == 'te' %}selected{% endif %}>Telugu</option>
                <option value="ta" {% if selected_language == 'ta' %}selected{% endif %}>Tamil</option>
                <option value="kn" {% if selected_language == 'kn' %}selected{% endif %}>Kannada</option>
                <option value="ml" {% if selected_language == 'ml' %}selected{% endif %}>Malayalam</option>
                <option value="bn" {% if selected_language == 'bn' %}selected{% endif %}>Bengali</option>
            </select>
            <button type="submit">{{ ui.analyze_plant }}</button>
        </form>
        {% if diagnosis %}
        <h2>{{ ui.diagnosis_result }}</h2>
        <p>{{ diagnosis }}</p>
        {% endif %}
    </main>
    <footer>
        <a href="/">Home</a> | <a href="/advisor">Advisor</a>
    </footer>
</body>
</html>
