<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Prices - Current Market Rates</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>{{ ui.crop_prices }}</h1>
        <p>{{ ui.current_market }}</p>
    </header>
    <main>
        <form method="get" style="display:inline-block; margin-right: 20px;">
            <label for="language">{{ ui.choose_language }}</label>
            <select id="language" name="language" onchange="this.form.submit()">
                <option value="en" {% if selected_language == 'en' %}selected{% endif %}>English</option>
                <option value="hi" {% if selected_language == 'hi' %}selected{% endif %}>Hindi</option>
                <option value="te" {% if selected_language == 'te' %}selected{% endif %}>Telugu</option>
                <option value="ta" {% if selected_language == 'ta' %}selected{% endif %}>Tamil</option>
                <option value="kn" {% if selected_language == 'kn' %}selected{% endif %}>Kannada</option>
                <option value="ml" {% if selected_language == 'ml' %}selected{% endif %}>Malayalam</option>
                <option value="bn" {% if selected_language == 'bn' %}selected{% endif %}>Bengali</option>
            </select>
        </form>
        <a href="/edit-crop-prices" style="display:inline-block; padding:8px 16px; background:#4CAF50; color:white; text-decoration:none; border-radius:4px;">Edit Prices</a>
        <table>
            <thead>
                <tr>
                    <th>{{ ui.crop }}</th>
                    <th>{{ ui.price }}</th>
                    <th>{{ ui.unit }}</th>
                    <th>{{ ui.market }}</th>
                </tr>
            </thead>
            <tbody>
                {% for crop in prices %}
                <tr>
                    <td>{{ crop.name }}</td>
                    <td>₹{{ crop.price }}</td>
                    <td>{{ crop.unit }}</td>
                    <td>{{ crop.market }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <p>{{ ui.note_prices }}</p>
    </main>
    <footer>
        <a href="/">Home</a> | <a href="/advisor">Advisor</a>
    </footer>
</body>
</html>
